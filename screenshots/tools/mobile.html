<!DOCTYPE html>
<!--
  App Store screenshot scene for iPhone and iPad: caption on top, the real extension popup
  shown as Safari's extension sheet over a sample page. Rendered by snap.swift via render.sh.
  Usage: mobile.html?device=phone&scene=1..4   (e.g. viewport 440x956 at 3x = 1320x2868)
         mobile.html?device=tablet&scene=1..4  (e.g. viewport 1032x1376 at 2x = 2064x2752)
  The layout fills whatever viewport it's rendered at; render.sh picks the store sizes.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overflow: hidden; }
      body {
        --bg: linear-gradient(160deg, #e8f5ee 0%, #cfe9db 100%);
        --ink: #0f3d26;
        --sub: #2f6b4c;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body { width: 100vw; height: 100vh; }
      body.phone { padding: 64px 28px 0; }
      body.tablet { padding: 96px 80px 0; }
      .caption { text-align: center; }
      .phone h1 { font-size: 34px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; }
      .phone p { margin-top: 14px; font-size: 17px; line-height: 1.4; color: var(--sub); }
      .tablet h1 { font-size: 56px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
      .tablet p { margin: 20px auto 0; max-width: 760px; font-size: 24px; line-height: 1.4; color: var(--sub); }

      .screen {
        position: relative;
        margin-top: 36px;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.06);
      }
      .phone .screen { width: 100%; flex: 1; border-radius: 44px 44px 0 0; }
      .tablet .screen { width: 100%; flex: 1; margin-top: 56px; border-radius: 36px 36px 0 0; }

      .page { padding: 28px 24px; color: #222; }
      .page h2 { font-size: 22px; margin-bottom: 10px; }
      .tablet .page { padding: 40px 48px; }
      .tablet .page h2 { font-size: 30px; }
      .row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 15px; }
      .row b { width: 100px; color: #1e7f4f; }
      .tablet .row { font-size: 19px; padding: 16px 0; }
      .tablet .row b { width: 140px; }
      .row .bar { flex: 1; height: 9px; margin-top: 5px; border-radius: 5px; background: #ececec; }

      .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); }
      .sheet {
        position: absolute;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
      }
      .phone .sheet { bottom: 0; left: 0; right: 0; border-radius: 24px 24px 0 0; }
      .tablet .sheet { top: 150px; left: 50%; border-radius: 22px; }
      .popup { width: 400px; height: 600px; border: 0; transform-origin: top left; }
    </style>
  </head>
  <body class="light">
    <div class="caption">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="screen">
      <div class="page">
        <h2>Open orders</h2>
        <div id="rows"></div>
      </div>
      <div class="dim"></div>
      <div class="sheet"><iframe class="popup" id="popup" title="String to CSV popup"></iframe></div>
    </div>

    <script>
      // Size the popup sheet to the screen: full width on phones, a centred card on tablets.
      const device = new URLSearchParams(location.search).get("device") || "phone";
      document.body.classList.add(device);
      const screenEl = document.querySelector(".screen");
      const sheet = document.querySelector(".sheet");
      const popupScale = device === "phone" ? screenEl.clientWidth / 400 : 1.4;
      sheet.style.width = 400 * popupScale + "px";
      sheet.style.height = 600 * popupScale + "px";
      if (device === "tablet") sheet.style.marginLeft = (-400 * popupScale) / 2 + "px";
      document.getElementById("popup").style.transform = `scale(${popupScale})`;
    </script>
    <script src="scenes.js"></script>
  </body>
</html>
