name: Check Extension Builds

on:
  pull_request:
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build extension files
        run: ./build.sh

      - name: Lint Firefox add-on
        run: npx --yes web-ext@8 lint --source-dir dist --self-hosted=false
