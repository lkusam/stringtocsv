name: Build Release Zips

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - "index.html"
      - "scripts.js"
      - "styles.css"
      - "icons/**"
      - "vendor/**"
      - "build.sh"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so the tag check below can see existing tags

      - name: Read version from manifest.json
        id: manifest_version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' manifest.json | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.manifest_version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.manifest_version.outputs.version }} already exists; bump the version in manifest.json to make a new release"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Chrome and Firefox zips
        run: ./build.sh

      - name: Generate Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## String to CSV Converter v${{ steps.manifest_version.outputs.version }}

          | Store | File | Upload at |
          | --- | --- | --- |
          | Chrome Web Store (also Edge Add-ons) | `string-to-csv-converter-chrome-v${{ steps.manifest_version.outputs.version }}.zip` | Chrome Web Store Developer Dashboard → Package → Upload new package |
          | Firefox Add-ons | `string-to-csv-converter-firefox-v${{ steps.manifest_version.outputs.version }}.zip` | addons.mozilla.org Developer Hub → Manage → Upload New Version |
          | Safari | Archive from Xcode | See "Safari" under "Releasing" in the README |

          ### Load unpacked for testing
          - **Chrome / Edge**: extract the Chrome zip, open `chrome://extensions/`, enable Developer mode and click "Load unpacked"
          - **Firefox**: open `about:debugging#/runtime/this-firefox` → "Load Temporary Add-on…" and pick the Firefox zip
          EOF

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.manifest_version.outputs.version }}
          name: String to CSV Converter v${{ steps.manifest_version.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/string-to-csv-converter-chrome-v${{ steps.manifest_version.outputs.version }}.zip
            dist/string-to-csv-converter-firefox-v${{ steps.manifest_version.outputs.version }}.zip
